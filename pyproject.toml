[project]
name = "ha-tgn-voda"
version = "0.4.0"
description = "Home Assistant integration for the TGN Voda water utility portal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["home-assistant", "water", "tgn-voda"]
classifiers = [
    "Framework :: AsyncIO",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
]
dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.3",
    "certifi>=2024.7.4",
]

[project.urls]
Repository = "https://github.com/Nikita-28-07/ha-tgn-voda"
Documentation = "https://github.com/Nikita-28-07/ha-tgn-voda"
"Bug Tracker" = "https://github.com/Nikita-28-07/ha-tgn-voda/issues"
Changelog = "https://github.com/Nikita-28-07/ha-tgn-voda/blob/master/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.17.1",
    "pytest-homeassistant-custom-component>=0.13.354",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-s -ra"
